name: Document retrieval POC tests

on:
  pull_request:
    paths:
      - "poc/**"
      - ".github/workflows/document-poc-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.12 retrieval tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional PDF reader
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Run tests
        run: python -m unittest discover -s poc -p "test_*.py" -v
